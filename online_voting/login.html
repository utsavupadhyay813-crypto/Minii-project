<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Online Voting System</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="container">
    <div class="card form-narrow">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <p>
          <button type="submit" class="btn">Login</button> 
          <a href="register.html">New voter? Register</a>
        </p>
      </form>
      <div style="margin-top: 15px; font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px;">
        <strong>Demo Accounts:</strong><br>
        Admin: <code>admin@vote.com</code> / <code>Admin@123</code><br>
        Voter: <code>utsavupadhyay813@gmail.com</code> / <code>Password@123</code>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OVS.renderLayout({ title: 'Login', relativePath: '' });

      const session = OVS.getSession();
      if (session) {
        window.location.href = session.role === 'admin' ? 'admin/dashboard.html' : 'voter/dashboard.html';
        return;
      }

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = OVS.login(email, password);
        if (res.success) {
          OVS.flash(`Welcome back, ${res.user.name}!`);
          window.location.href = res.user.role === 'admin' ? 'admin/dashboard.html' : 'voter/dashboard.html';
        } else {
          // Display error flash alert dynamically
          const oldAlert = document.querySelector('.alert');
          if (oldAlert) oldAlert.remove();

          const alertDiv = document.createElement('div');
          alertDiv.className = 'alert a-error';
          alertDiv.textContent = res.message;
          const container = document.querySelector('main.container');
          container.insertBefore(alertDiv, container.firstChild);
        }
      });
    });
  </script>
</body>
</html>
