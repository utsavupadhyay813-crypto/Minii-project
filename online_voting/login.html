<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Online Voting System</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="container">
    <div class="card form-narrow">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <p style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between;">
          <button type="submit" class="btn">Login</button> 
          <a href="register.html">New voter? Register</a>
        </p>
      </form>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OVS.renderLayout({ title: 'Login', active: 'login', relativePath: '' });

      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const form = document.getElementById('loginForm');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = passInput.value;

        const res = OVS.login(email, password);
        if (res.success) {
          OVS.flash(`Welcome back, ${res.user.name}!`);
          window.location.href = res.user.role === 'admin' ? 'admin/dashboard.html' : 'voter/dashboard.html';
        } else {
          const oldAlert = document.querySelector('.alert');
          if (oldAlert) oldAlert.remove();

          const alertDiv = document.createElement('div');
          alertDiv.className = 'alert a-error';
          alertDiv.textContent = res.message;
          const container = document.querySelector('main.container');
          container.insertBefore(alertDiv, container.firstChild);
        }
      });
    });
  </script>
</body>
</html>
