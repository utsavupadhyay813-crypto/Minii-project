<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Online Voting System</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="container">
    <div class="card form-narrow">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="e.g. admin@vote.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">

        <p style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between;">
          <button type="submit" class="btn">Login</button> 
          <a href="register.html">New voter? Register</a>
        </p>
      </form>

      <div style="margin-top: 20px; font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 14px;">
        <span style="font-weight: 600; color: var(--muted); display: block; margin-bottom: 8px;">⚡ 1-Click Fast Fill for Demo:</span>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <button type="button" class="btn sm ghost" id="fillAdminBtn" style="text-align: left;">
            👑 <b>Admin:</b> admin@vote.com (Admin@123)
          </button>
          <button type="button" class="btn sm ghost" id="fillVoter1Btn" style="text-align: left;">
            🗳️ <b>Verified Voter (Shivam):</b> utsavupadhyay813@gmail.com
          </button>
          <button type="button" class="btn sm ghost" id="fillVoter2Btn" style="text-align: left;">
            🗳️ <b>Verified Voter (Yash):</b> yash@vote.com
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OVS.renderLayout({ title: 'Login', active: 'login', relativePath: '' });

      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');

      document.getElementById('fillAdminBtn').onclick = () => {
        emailInput.value = 'admin@vote.com';
        passInput.value = 'Admin@123';
      };

      document.getElementById('fillVoter1Btn').onclick = () => {
        emailInput.value = 'utsavupadhyay813@gmail.com';
        passInput.value = 'Password@123';
      };

      document.getElementById('fillVoter2Btn').onclick = () => {
        emailInput.value = 'yash@vote.com';
        passInput.value = 'Password@123';
      };

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = passInput.value;

        const res = OVS.login(email, password);
        if (res.success) {
          OVS.flash(`Welcome back, ${res.user.name}!`);
          window.location.href = res.user.role === 'admin' ? 'admin/dashboard.html' : 'voter/dashboard.html';
        } else {
          const oldAlert = document.querySelector('.alert');
          if (oldAlert) oldAlert.remove();

          const alertDiv = document.createElement('div');
          alertDiv.className = 'alert a-error';
          alertDiv.textContent = res.message;
          const container = document.querySelector('main.container');
          container.insertBefore(alertDiv, container.firstChild);
        }
      });
    });
  </script>
</body>
</html>
