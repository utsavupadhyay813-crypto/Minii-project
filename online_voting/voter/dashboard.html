<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Elections - Online Voting System</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
      <h1 id="welcomeHeader" style="margin:0;">Welcome, Voter</h1>
      <span style="font-size:0.9rem; color:var(--muted);">Voter Portal</span>
    </div>

    <div class="card" id="voterInfoCard">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div>
          Voter Identification Number: <code style="font-size:1.1rem; font-weight:700;"><b id="voterNumberDisplay">-</b></code> &nbsp; 
          Account Eligibility: <span id="voterStatusBadge"></span>
        </div>
      </div>
      <div id="unverifiedNotice" style="display: none; margin-top: 12px; padding:10px; background:#fff9db; border-radius:6px; border:1px solid #ffe066;">
        ⚠️ <b>Pending Verification:</b> Your registration is awaiting administrator verification before ballots can be cast.<br>
        <button type="button" class="btn sm ok" id="quickVerifySelfBtn" style="margin-top:8px;">⚡ Instant Demo Verify This Account</button>
      </div>
    </div>

    <div class="card">
      <h3>Active &amp; Completed Elections</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Election Title</th>
              <th>Voting Window</th>
              <th>State</th>
              <th style="text-align:right;">Participation &amp; Action</th>
            </tr>
          </thead>
          <tbody id="voter-elections-tbody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OVS.requireRole('voter', '../')) return;
      OVS.renderLayout({ title: 'My Elections', active: 'dashboard', relativePath: '../' });

      const session = OVS.getSession();
      document.getElementById('welcomeHeader').textContent = `Welcome, ${session.name}`;

      const voter = OVS.getVoterByUserId(session.uid);
      if (voter) {
        document.getElementById('voterNumberDisplay').textContent = voter.voter_number;
        document.getElementById('voterStatusBadge').innerHTML = OVS.badge(voter.status);
        if (voter.status !== 'verified') {
          const notice = document.getElementById('unverifiedNotice');
          notice.style.display = 'block';

          document.getElementById('quickVerifySelfBtn').onclick = () => {
            let voters = OVS.get(OVS.KEYS.VOTERS);
            const me = voters.find(v => Number(v.voter_id) === Number(voter.voter_id));
            if (me) {
              me.status = 'verified';
              OVS.set(OVS.KEYS.VOTERS, voters);
              OVS.flash('Your voter account has been verified! You may now cast your vote.');
              window.location.reload();
            }
          };
        }
      }

      const elections = OVS.get(OVS.KEYS.ELECTIONS).filter(e => e.status !== 'draft');
      const participation = OVS.get(OVS.KEYS.PARTICIPATION);
      const votedElections = voter 
        ? participation.filter(p => Number(p.voter_id) === Number(voter.voter_id)).map(p => Number(p.election_id)) 
        : [];

      const tbody = document.getElementById('voter-elections-tbody');
      if (elections.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No elections available at this time.</td></tr>';
        return;
      }

      tbody.innerHTML = elections.map(el => {
        const state = OVS.electionState(el);
        const hasVoted = votedElections.includes(Number(el.election_id));
        const isVerified = voter && voter.status === 'verified';
        const canVote = state === 'live' && isVerified && !hasVoted;
        const canSeeResults = OVS.resultsVisible(el);

        let actionHtml = '';
        if (hasVoted) {
          actionHtml += '<span style="color: var(--ok); font-weight: 600; margin-right:8px;">✅ Ballot Cast</span>';
        }
        if (canVote) {
          actionHtml += `<a class="btn sm ok" href="vote.html?id=${el.election_id}">Vote Now 🗳️</a> `;
        }
        if (canSeeResults) {
          actionHtml += `<a class="btn sm ghost" href="results.html?id=${el.election_id}">Results 📊</a>`;
        }

        if (!hasVoted && !canVote && !canSeeResults) {
          if (state === 'scheduled') {
            actionHtml = '<small style="color:var(--muted);">Voting not started yet</small>';
          } else if (!isVerified) {
            actionHtml = '<small style="color:var(--warn);">Verification required</small>';
          } else {
            actionHtml = '<small style="color:var(--muted);">&mdash;</small>';
          }
        }

        return `
          <tr>
            <td>
              <b>${OVS.e(el.title)}</b><br>
              <small>${OVS.e(el.description || '')}</small>
            </td>
            <td>
              <small>${OVS.e(el.start_date)}<br>to ${OVS.e(el.end_date)}</small>
            </td>
            <td>${OVS.badge(state)}</td>
            <td style="text-align:right;">${actionHtml}</td>
          </tr>
        `;
      }).join('');
    });
  </script>
</body>
</html>
